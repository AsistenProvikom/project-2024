# ─────────────────────────────────────────────────────────────────────────────
# supervisord.conf — Process manager configuration
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
user=root
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ── 1. Virtual display ────────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 2. Window manager ─────────────────────────────────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 3. VNC server ────────────────────────────────────────────────────────────
[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -noxdamage -quiet -repeat
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 4. WebSocket ↔ VNC bridge (NO --web, nginx serves noVNC files directly) ──
[program:websockify]
command=python3 -m websockify 6080 localhost:5900
autorestart=true
startsecs=6
priority=40
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 5. Flask REST API ─────────────────────────────────────────────────────────
[program:flask]
command=python3 /api/server.py
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 6. nginx ──────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=7
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
