[supervisord]
nodaemon=true
user=root
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ── 1. Virtual display ─────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 2. Window manager ──────────────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 3. Flask app (serves everything: static + API + streaming) ──
[program:flask]
command=python3 /app/server.py
environment=DISPLAY=":99",HOME="/root",PORT="%(ENV_PORT)s"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
