# ─────────────────────────────────────────────────────────────────────────────
# supervisord.conf — Process manager configuration
# Manages: Xvfb → fluxbox → x11vnc → websockify → Flask API → nginx
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ── 1. Virtual display ────────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 2. Window manager (minimal, dark background) ──────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 3. VNC server (reads Xvfb display) ───────────────────────────────────────
[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -noxdamage -quiet -repeat
autorestart=true
startsecs=3
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 4. WebSocket ↔ VNC bridge + noVNC static files ───────────────────────────
[program:websockify]
command=python3 -m websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
startsecs=4
priority=40
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# ── 5. Flask REST API (launch/stop games) ────────────────────────────────────
[program:flask]
command=python3 /api/server.py
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 6. nginx reverse proxy (entry point) ─────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=5
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
